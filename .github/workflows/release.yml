# Creates the GitHub release page automatically when a version tag (v*) is pushed.
# The notes come from CHANGELOG.md (tools/release_notes.py). Tests must pass first.
# For a tag that already exists: Actions -> Release -> Run workflow -> enter the tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.1.4"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # main has the newest CHANGELOG and tools/; the tests run on the tag's own code
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests on the tagged code
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          git rev-parse "$TAG"
          git worktree add /tmp/tagged "$TAG"
          cd /tmp/tagged && python3 -m unittest discover -s tests
      - name: Release notes from CHANGELOG
        run: |
          python3 tools/release_notes.py "$TAG" > notes.md
          cat notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "tayyib-trader $TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" --title "tayyib-trader $TAG" --notes-file notes.md --latest --verify-tag
          fi
