<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>tayyib dashboard</title>
<style>
/* design-system/tayyib/MASTER.md: plain CSS, offline, system fonts, light + dark, status = label + shape + colour */
:root {
  --bg:#F7F8FA; --surface:#FFFFFF; --surface-2:#EEF1F5; --fg:#111827; --muted:#4B5563; --border:#D5DAE1;
  --primary:#1E40AF; --pass:#00735A; --warn:#8A5A00; --block:#B03A00; --info:#005A8C; --unknown:#5B6472;
  --s1:2px; --s2:4px; --s3:8px; --s4:12px; --s5:16px; --s6:24px; --s7:32px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
  --radius:6px; --shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#0F172A; --surface:#192134; --surface-2:#101A34; --fg:#F1F5F9; --muted:#A3B1C6;
    --border:rgba(255,255,255,.12); --primary:#93B4FF; --pass:#3FD0A8; --warn:#F2B84B; --block:#FF8A5C;
    --info:#6CC3F5; --unknown:#A3AEBD; --shadow:none; }
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 var(--font); }
a { color:var(--primary); }
.wrap { max-width:1400px; margin:0 auto; padding:var(--s5); }
header.top { display:flex; flex-wrap:wrap; gap:var(--s3) var(--s5); align-items:baseline; justify-content:space-between;
  border-bottom:1px solid var(--border); padding-bottom:var(--s4); }
h1 { font-size:18px; margin:0; }
h2 { font-size:16px; margin:var(--s6) 0 var(--s3); }
h3 { font-size:14px; margin:var(--s5) 0 var(--s2); }
.muted { color:var(--muted); }
#datadir { overflow-wrap:anywhere; word-break:break-all; }
header.top > div, .banner > div, .card, .meta-line > span { min-width:0; overflow-wrap:anywhere; }
td.nowrap { white-space:nowrap; }
td.reason { min-width:240px; }
.small { font-size:13px; }
.mono, td.num, .num { font-family:var(--mono); font-variant-numeric:tabular-nums; }
.settings { font-weight:600; }
nav[role=tablist] { display:flex; gap:var(--s2); margin:var(--s4) 0; border-bottom:1px solid var(--border); overflow-x:auto; }
nav[role=tablist] button { font:inherit; font-weight:600; background:none; border:0; border-bottom:3px solid transparent;
  color:var(--muted); padding:var(--s3) var(--s4); cursor:pointer; min-height:44px; white-space:nowrap;
  transition:color .15s, border-color .15s; }
nav[role=tablist] button[aria-selected=true] { color:var(--primary); border-bottom-color:var(--primary); }
nav[role=tablist] button:hover { color:var(--fg); }
:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
.banner { display:flex; gap:var(--s3); align-items:flex-start; background:var(--surface); border:1px solid var(--border);
  border-left:3px solid var(--unknown); border-radius:var(--radius); padding:var(--s3) var(--s4); margin:var(--s3) 0; }
.banner.k-warn { border-left-color:var(--warn); background:color-mix(in srgb, var(--warn) 10%, var(--surface)); }
.banner.k-block { border-left-color:var(--block); background:color-mix(in srgb, var(--block) 10%, var(--surface)); }
.banner.k-info { border-left-color:var(--info); }
.banner .ico { flex:none; margin-top:2px; }
.badge { display:inline-flex; align-items:center; gap:var(--s2); font-size:12px; font-weight:600; text-transform:uppercase;
  letter-spacing:.02em; border:1px solid currentColor; border-radius:999px; padding:1px 7px 1px 5px; white-space:nowrap; }
.k-pass { color:var(--pass); } .k-warn { color:var(--warn); } .k-block { color:var(--block); }
.k-info { color:var(--info); } .k-unknown { color:var(--unknown); }
.banner.k-warn, .banner.k-block, .banner.k-info, .banner.k-unknown { color:var(--fg); }
.banner.k-warn .ico { color:var(--warn); } .banner.k-block .ico { color:var(--block); }
.banner.k-info .ico { color:var(--info); } .banner.k-unknown .ico { color:var(--unknown); }
.meta-line { display:flex; flex-wrap:wrap; gap:var(--s2) var(--s5); margin:var(--s3) 0; font-size:14px; }
.meta-line b { font-weight:600; }
.cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:var(--s4); margin:var(--s3) 0; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:var(--s4); box-shadow:var(--shadow); }
.card .head { display:flex; justify-content:space-between; gap:var(--s3); align-items:center; margin-bottom:var(--s3); }
.card .sym { font-weight:700; font-size:16px; }
.kv { display:grid; grid-template-columns:auto 1fr; gap:var(--s1) var(--s4); font-size:14px; }
.kv dt { color:var(--muted); } .kv dd { margin:0; font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; }
.controls { display:flex; flex-wrap:wrap; gap:var(--s3) var(--s4); align-items:center; margin:var(--s3) 0; }
.controls label { font-size:14px; display:flex; gap:var(--s2); align-items:center; }
select, input[type=search] { font:inherit; font-size:14px; color:var(--fg); background:var(--surface);
  border:1px solid var(--border); border-radius:var(--radius); padding:6px 8px; min-height:36px; }
input[type=search] { min-width:220px; }
.tablewrap { overflow-x:auto; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); }
table { border-collapse:collapse; width:100%; font-size:14px; }
th, td { padding:4px 8px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; height:32px; }
thead th { position:sticky; top:0; background:var(--surface-2); font-size:13px; font-weight:600; white-space:nowrap; }
td.num, th.num { text-align:right; white-space:nowrap; }
tbody tr:hover > td { background:color-mix(in srgb, var(--primary) 5%, var(--surface)); }
th button.sort { font:inherit; font-weight:600; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
th button.sort::after { content:" \2195"; color:var(--muted); }
th[aria-sort=ascending] button.sort::after { content:" \2191"; color:var(--fg); }
th[aria-sort=descending] button.sort::after { content:" \2193"; color:var(--fg); }
button.link { font:inherit; font-size:13px; color:var(--primary); background:none; border:1px solid var(--border);
  border-radius:var(--radius); padding:2px 8px; cursor:pointer; min-height:28px; white-space:nowrap; transition:background .15s; }
button.link:hover { background:var(--surface-2); }
button.copy { font:inherit; font-size:13px; font-weight:600; color:var(--primary); background:var(--surface);
  border:1px solid var(--primary); border-radius:var(--radius); padding:4px 10px; cursor:pointer; min-height:32px; }
button.copy:hover { background:var(--surface-2); }
tr.detail > td { background:var(--surface-2); }
.why { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:var(--s3) var(--s5); padding:var(--s3) 0; }
.why h4 { margin:0 0 var(--s2); font-size:13px; letter-spacing:.04em; color:var(--muted); }
.why ul { list-style:none; margin:0; padding:0; font-size:13px; }
.why li { display:grid; grid-template-columns:72px 1fr; gap:var(--s3); padding:2px 0; border-bottom:1px dotted var(--border); }
.why .mark { font-weight:700; white-space:nowrap; }
.flag { display:inline-flex; align-items:center; gap:3px; font-size:12px; font-weight:600; margin-left:var(--s2); white-space:nowrap; }
tr.hl-capped > td:first-child, tr.hl-near > td:first-child { box-shadow:inset 3px 0 0 var(--warn); }
.changed { color:var(--fg); }
.bar { position:relative; height:12px; background:var(--surface-2); border:1px solid var(--border); border-radius:3px; min-width:160px; }
.bar .fill { position:absolute; left:0; top:0; bottom:0; background:var(--pass); border-radius:2px 0 0 2px; }
.bar.s-near .fill { background:var(--warn); } .bar.s-over .fill { background:var(--block); }
.bar .tick { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--fg); }
.bar .tick.near { background:var(--warn); width:1px; }
.ratios { display:grid; grid-template-columns:minmax(200px, 300px) minmax(160px, 1fr) auto; gap:var(--s2) var(--s4); align-items:center; font-size:13px; }
.stats td, .stats th { white-space:nowrap; }
pre.steps { white-space:pre-wrap; font:13px/1.5 var(--mono); background:var(--surface-2); border:1px solid var(--border);
  border-radius:var(--radius); padding:var(--s3); margin:var(--s2) 0; }
.steps-head { display:flex; justify-content:space-between; align-items:center; gap:var(--s3); margin-top:var(--s3); }
svg.chart { width:100%; max-width:720px; height:auto; display:block; }
svg.chart text { font:11px var(--font); fill:var(--muted); }
svg.chart .price { fill:none; stroke:var(--primary); stroke-width:1.6; }
svg.chart .lv-entry { stroke:var(--info); stroke-width:1.2; }
svg.chart .lv-stop { stroke:var(--block); stroke-width:1.2; stroke-dasharray:6 4; }
svg.chart .lv-target { stroke:var(--pass); stroke-width:1.4; stroke-dasharray:2 3; }
svg.chart .zero { stroke:var(--muted); stroke-dasharray:3 3; }
svg.chart .eq { fill:none; stroke:var(--primary); stroke-width:2; }
svg.chart .dot { fill:var(--primary); }
svg.chart .m-fill { fill:var(--info); } svg.chart .m-exit { fill:var(--fg); }
svg.chart .sig { stroke:var(--muted); stroke-dasharray:1 3; }
.empty { padding:var(--s5); color:var(--muted); }
footer { margin-top:var(--s7); padding-top:var(--s4); border-top:1px solid var(--border); font-size:13px; color:var(--muted); }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
[hidden] { display:none !important; }
@media (max-width: 640px) {
  .wrap { padding:var(--s5) 16px; }
  input[type=search] { min-width:0; width:100%; }
  .ratios { grid-template-columns:1fr; }
  .why { grid-template-columns:1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>

<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>tayyib dashboard <span class="muted small" id="ver"></span></h1>
      <div class="small muted">Read-only. Data folder: <span class="mono" id="datadir">UNKNOWN</span></div>
    </div>
    <div class="small settings" id="settings">Settings: UNKNOWN</div>
  </header>
  <div id="globalBanners"></div>
  <nav role="tablist" aria-label="Dashboard sections">
    <button role="tab" id="tab-today" aria-controls="p-today" aria-selected="true">Today</button>
    <button role="tab" id="tab-results" aria-controls="p-results" aria-selected="false" tabindex="-1">Results</button>
    <button role="tab" id="tab-halal" aria-controls="p-halal" aria-selected="false" tabindex="-1">Halal</button>
    <button role="tab" id="tab-tickets" aria-controls="p-tickets" aria-selected="false" tabindex="-1">Tickets</button>
  </nav>
  <main>
    <section role="tabpanel" id="p-today" aria-labelledby="tab-today"></section>
    <section role="tabpanel" id="p-results" aria-labelledby="tab-results" hidden></section>
    <section role="tabpanel" id="p-halal" aria-labelledby="tab-halal" hidden></section>
    <section role="tabpanel" id="p-tickets" aria-labelledby="tab-tickets" hidden></section>
  </main>
  <footer><span id="disclaimer">Not financial advice, not a fatwa.</span>
    <span class="muted"> This page cannot place, change or cancel an order.</span></footer>
  <div class="sr" aria-live="polite" id="live"></div>
</div>
<script>

  return e;
}
function shown(v) { return (v === null || v === undefined || v === "") ? "UNKNOWN" : String(v); }

// Five shapes (MASTER.md section 4): never colour alone
function icon(kind, size) {

}
function banner(text, kind) {

function missing(panel, d) {

function getJSON(url) {   // GET only, same origin

}

// --- sortable table --------------------------------------------------------------------------------
function table(cols, rows, opts) {

// --- Today ------------------------------------------------------------------------------------------
function whyPanel(groups) {
  var box = el("div", { cls:"why" });
  groups.forEach(function (g) {
    var ul = el("ul");
    g.items.forEach(function (x) {
      var k = x.mark === "ok" ? "pass" : x.mark === "failed" ? "block" : x.mark === "info" ? "info" : "unknown";
      var word = x.mark === "ok" ? "ok" : x.mark === "failed" ? "failed" : x.mark === "info" ? "info" : "";
      var line = [el("b", { text:x.check }), " ", el("span", { cls:"mono", text:x.value })];
      if (x.limit) line.push(" ", el("span", { cls:"mono muted", text:x.limit }));
      if (x.near_limit) line.push(el("span", { cls:"flag k-warn" }, icon("warn", 12), "near limit"));
      if (x.stop_capped) line.push(el("span", { cls:"flag k-warn" }, icon("warn", 12), "stop capped"));
      if (x.note) line.push(el("div", { cls:"muted", text:x.note }));
      ul.appendChild(el("li", null, el("span", { cls:"mark k-" + k }, x.symbol + (word && word !== x.symbol ? " " + word : "")), el("span", null, line)));
    });
    box.appendChild(el("div", null, el("h4", { text:g.group }), ul));
  });
  return box;
}
function flags(r) {
  return [r.stop_capped ? el("span", { cls:"flag k-warn", title:"the % cap set the stop, not the chart" }, icon("warn", 12), "stop capped") : null,
          r.near_limit ? el("span", { cls:"flag k-warn", title:"a halal ratio is within 10% of its limit" }, icon("warn", 12), "near halal limit") : null];
}
function pickCard(r) {
  if (r.halal_changed) return el("div", { cls:"card" }, el("div", { cls:"head" }, el("span", { cls:"sym", text:r.symbol }), badge(r.halal_now || "unknown")),
    banner(r.message, "block"));

  return el("div", { cls:"card" },
    el("div", { cls:"head" }, el("span", null, el("span", { cls:"sym", text:r.symbol }), " ", el("span", { cls:"muted small", text:r.mode + " " + r.setup })), badge(r.risk)),
    el("dl", { cls:"kv" }, el("dt", { text:"Buy above" }), el("dd", { text:d.entry }), el("dt", { text:"Stop" }), el("dd", { text:d.stop + " (" + d.stop_pct + ")" }),
      el("dt", { text:"Target" }), el("dd", { text:d.target }), el("dt", { text:"Quantity" }), el("dd", { text:d.qty }),
      el("dt", { text:"Risk at stop" }), el("dd", { text:d.loss_at_stop_rs }), el("dt", { text:"Time machine" }), el("dd", { text:d.expectancy_r }),
      el("dt", { text:"Ranked by" }), el("dd", { text:r.ranked_by === "score" ? "setup score " + d.score : "expectancy" })),
    el("div", { cls:"small muted", style:"margin-top:4px" }, "Expectancy: " + r.expectancy_use, flags(r)));
}
function renderToday(panel, d, dates) {
  panel.textContent = "";

    { title:"Target", num:true, cell:function (p) { return p.display.target; } }, { title:"Since", cell:function (p) { return p.display.opened; } },
    { title:"Out by", cell:function (p) { return p.display.time_stop_date; } }], d.open, { empty:"No open positions." }));
  add(panel, el("h2", { text:"Closed trades" }));
  add(panel, table([
    { title:"Stock", cell:function (p) { return el("b", { text:p.symbol }); } }, { title:"Qty", num:true, cell:function (p) { return p.display.qty; } },
    { title:"Entry", num:true, cell:function (p) { return p.display.entry; } }, { title:"Exit", num:true, cell:function (p) { return p.display.exit; } },
    { title:"Reason", cell:function (p) { return shown(p.reason); } }, { title:"Closed", cell:function (p) { return p.display.closed; } },
    { title:"P&L", num:true, cell:function (p) { return p.display.pnl_rs; } }, { title:"R", num:true, cell:function (p) { return p.display.r; } }], d.closed, { empty:"No closed trades yet." }));
  add(panel, el("p", { cls:"small", text:"Closed: " + d.totals.closed + ", winners " + d.totals.winners + ", total " + d.totals.pnl_rs + ", average " + d.totals.avg_r + " (after charges)." }));
}

// --- tabs, header -----------------------------------------------------------------------------------
var LOADERS = {
  today:function () { loadToday(null); },
  results:function () { getJSON("/api/tracker").then(function (d) { renderResults(document.getElementById("p-results"), d); }); },
  halal:function () { getJSON("/api/halal").then(function (d) { renderHalal(document.getElementById("p-halal"), d); }); },
  tickets:function () { getJSON("/api/tickets").then(function (d) { renderTickets(document.getElementById("p-tickets"), d); }); }
};
var loaded = {};
function show(name, focus) {
  if (!LOADERS[name]) name = "today";
  Object.keys(LOADERS).forEach(function (n) {
    var t = document.getElementById("tab-" + n), p = document.getElementById("p-" + n), on = n === name;
    t.setAttribute("aria-selected", on ? "true" : "false"); t.tabIndex = on ? 0 : -1; p.hidden = !on;
    if (on && focus) t.focus();
  });
  if (!loaded[name]) { loaded[name] = true; document.getElementById("p-" + name).appendChild(el("p", { cls:"empty", text:"Loading..." })); LOADERS[name](); }
  if (location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
}
var names = Object.keys(LOADERS);
names.forEach(function (n, i) {
  var t = document.getElementById("tab-" + n);
  t.addEventListener("click", function () { show(n); });
  t.addEventListener("keydown", function (e) {
    var k = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
    if (e.key === "Home") { show(names[0], true); e.preventDefault(); }
    else if (e.key === "End") { show(names[names.length - 1], true); e.preventDefault(); }
    else if (k) { show(names[(i + k + names.length) % names.length], true); e.preventDefault(); }
  });
});
window.addEventListener("hashchange", function () { show(location.hash.slice(1)); });
getJSON("/api/meta").then(function (m) {
  document.getElementById("ver").textContent = "v" + m.version;
  document.getElementById("datadir").textContent = m.data_dir;
  document.getElementById("settings").textContent = m.settings_header;
  document.getElementById("disclaimer").textContent = m.disclaimer;
  var g = document.getElementById("globalBanners");
  if (m.halal_banner) g.appendChild(banner(m.halal_banner, "warn"));
  (m.config_notes || []).forEach(function (n) { g.appendChild(banner(n, n.indexOf("CONFIG ERROR") === 0 ? "block" : "warn")); });
}).catch(function () { document.getElementById("globalBanners").appendChild(banner("The dashboard server is not answering.", "block")); });
show(location.hash.slice(1) || "today");
</script>
