<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="tayyib-token" content="{{TAYYIB_TOKEN}}">
<title>tayyib dashboard</title>
<style>
/* design-system/tayyib/MASTER.md (v0.1.7 redesign): plain CSS, offline, system fonts, light + dark,
   status = label + shape + colour, en-IN numbers formatted by the server. */
:root {
  --bg:#F4F1E9; --surface:#FFFDF8; --surface-2:#F1ECE1; --surface-3:#E6DFD1; --line:#E1D9C9; --line-strong:#CFC5B1;
  --fg:#16201C; --muted:#545E59; --primary:#0F5257; --primary-strong:#0A3D41; --primary-soft:#E0EEEC; --on-primary:#FFFFFF;
  --accent:#8C5E0E; --accent-soft:#F4E7CC; --hero-a:#0F5257; --hero-b:#0A3D41; --on-hero:#FFFFFF;
  --pass:#00735A; --warn:#8A5A00; --block:#B03A00; --info:#005A8C; --unknown:#5B6472;
  --pass-bg:#E2F2EC; --warn-bg:#F8EDD6; --block-bg:#FBE7DD; --info-bg:#E1EEF6; --unknown-bg:#ECEDEF;
  --risk-zone:#F3D9CC; --reward-zone:#D3EBE1;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:24px;
  --shadow-1:0 1px 2px rgba(40,32,16,.06), 0 1px 1px rgba(40,32,16,.04);
  --shadow-2:0 2px 6px rgba(40,32,16,.06), 0 10px 28px -12px rgba(40,32,16,.16);
  --shadow-3:0 24px 60px -18px rgba(20,16,8,.35);
  --ease:cubic-bezier(.2,.7,.2,1); --t:160ms;
  --nav-h:0px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#0C1311; --surface:#131C19; --surface-2:#18231F; --surface-3:#203029; --line:rgba(220,235,228,.10); --line-strong:rgba(220,235,228,.20);
    --fg:#ECF1EE; --muted:#A3B0AA; --primary:#7FD3C8; --primary-strong:#A9E5DD; --primary-soft:rgba(127,211,200,.13); --on-primary:#062421;
    --accent:#E3B866; --accent-soft:rgba(227,184,102,.14); --hero-a:#145550; --hero-b:#0B2E2B; --on-hero:#ECF6F3;
    --pass:#3FD0A8; --warn:#F2B84B; --block:#FF8A5C; --info:#6CC3F5; --unknown:#A3AEBD;
    --pass-bg:rgba(63,208,168,.12); --warn-bg:rgba(242,184,75,.12); --block-bg:rgba(255,138,92,.12); --info-bg:rgba(108,195,245,.12); --unknown-bg:rgba(163,174,189,.12);
    --risk-zone:rgba(255,138,92,.22); --reward-zone:rgba(63,208,168,.20);
    --shadow-1:0 1px 0 rgba(255,255,255,.03) inset; --shadow-2:0 1px 0 rgba(255,255,255,.04) inset, 0 12px 30px -16px rgba(0,0,0,.6);
    --shadow-3:0 30px 70px -20px rgba(0,0,0,.75);
  }
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 var(--sans); padding-bottom:var(--nav-h);
  background-image:radial-gradient(1200px 400px at 85% -120px, var(--primary-soft), transparent 70%); background-repeat:no-repeat; }
.num, .mono, .tile .v, td.num { font-variant-numeric:tabular-nums lining-nums; }
.mono { font-family:var(--mono); font-size:.92em; }
h1, h2, h3 { font-family:var(--serif); font-weight:600; letter-spacing:-.01em; margin:0; }
h2.section { font-size:22px; margin:36px 0 14px; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
h2.section small { font:500 13px/1.4 var(--sans); color:var(--muted); letter-spacing:0; }
h3 { font-size:17px; }
p { margin:0; }
.muted { color:var(--muted); }
.small { font-size:13px; }
a { color:var(--primary); }
.manual { display:flex; flex-wrap:wrap; align-items:center; gap:0 16px; margin-top:10px; font-size:14px; }
.manual .lbl { color:var(--muted); font-size:13px; width:100%; }
.manual .ml { display:inline-flex; align-items:center; flex-wrap:wrap; gap:0 6px; min-height:36px; }
@media (pointer:coarse) { .manual .ml { min-height:44px; } }
.manual a { font-weight:600; text-underline-offset:3px; }
.grp > .manual { padding:0 14px 10px; }
:focus-visible { outline:2.5px solid var(--primary); outline-offset:2px; border-radius:6px; }
[hidden] { display:none !important; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* --- top bar and tabs --- */
.topbar { position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(12px); backdrop-filter:saturate(1.4) blur(12px); border-bottom:1px solid var(--line); }
.topbar .in { max-width:1440px; margin:0 auto; padding:10px 24px; display:flex; align-items:center; gap:20px; min-height:64px; }
.brand { display:flex; align-items:center; gap:10px; min-width:0; text-decoration:none; color:var(--fg); }
.brand .word { font:600 21px/1 var(--serif); letter-spacing:-.01em; }
.brand .sub { font:500 12px/1.2 var(--sans); color:var(--muted); display:block; margin-top:3px; letter-spacing:.02em; }
.logo { flex:none; }
.logo .ring { fill:none; stroke:var(--primary); stroke-width:2; }
.logo .leaf { fill:var(--primary); } .logo .dot { fill:var(--accent); }
nav.tabs { display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:4px; margin:0 auto; }
nav.tabs button { font:600 14px/1 var(--sans); color:var(--muted); background:transparent; border:0; border-radius:999px; padding:0 16px; min-height:40px;
  display:inline-flex; align-items:center; gap:8px; cursor:pointer; transition:background var(--t) var(--ease), color var(--t) var(--ease); }
nav.tabs button:hover { color:var(--fg); }
nav.tabs button[aria-selected=true] { background:var(--surface); color:var(--primary); box-shadow:var(--shadow-1); }
nav.tabs svg { width:18px; height:18px; }
.setchip { flex:none; text-align:right; font-size:12px; line-height:1.35; color:var(--muted); max-width:260px; }
.setchip b { display:block; color:var(--fg); font-size:13px; }

.wrap { max-width:1440px; margin:0 auto; padding:24px 24px 0; }
footer.foot { max-width:1440px; margin:48px auto 0; padding:20px 24px 32px; border-top:1px solid var(--line); display:flex; flex-wrap:wrap;
  gap:6px 24px; justify-content:space-between; font-size:13px; color:var(--muted); }
footer.foot b { color:var(--fg); font-weight:600; }
#datadir { overflow-wrap:anywhere; }

/* --- banners, chips, badges --- */
.banner { display:flex; gap:12px; align-items:flex-start; padding:12px 16px; border-radius:var(--r-md); margin:0 0 12px; border:1px solid var(--line);
  background:var(--surface); box-shadow:var(--shadow-1); min-width:0; overflow-wrap:anywhere; }
.banner .ico { flex:none; margin-top:2px; }
.banner.k-warn { background:var(--warn-bg); border-color:color-mix(in srgb, var(--warn) 30%, transparent); }
.banner.k-block { background:var(--block-bg); border-color:color-mix(in srgb, var(--block) 30%, transparent); }
.banner.k-info { background:var(--info-bg); border-color:color-mix(in srgb, var(--info) 30%, transparent); }
.banner.k-unknown { background:var(--unknown-bg); }
.banner.k-pass { background:var(--pass-bg); border-color:color-mix(in srgb, var(--pass) 30%, transparent); }
.banner.k-pass > .ico { color:var(--pass); }
.banner .ico.k-warn, .banner.k-warn > .ico { color:var(--warn); } .banner.k-block > .ico { color:var(--block); }
.banner.k-info > .ico { color:var(--info); } .banner.k-unknown > .ico { color:var(--unknown); }
.badge { display:inline-flex; align-items:center; gap:5px; font:700 11.5px/1 var(--sans); letter-spacing:.05em; text-transform:uppercase;
  padding:5px 9px 5px 7px; border-radius:999px; white-space:nowrap; border:1px solid currentColor; }
.k-na { color:var(--unknown); } ul.items .mk.k-na { background:var(--unknown-bg); }
.newslines { margin-top:12px; display:grid; gap:6px; font-size:.9rem; }
.newslines .nl { display:grid; grid-template-columns:18px 1fr; gap:8px; align-items:start; }
.newslines .nl .mk { display:inline-flex; margin-top:2px; }
.newslines .nlab { font-weight:600; }
.k-pass { color:var(--pass); } .k-warn { color:var(--warn); } .k-block { color:var(--block); } .k-info { color:var(--info); } .k-unknown { color:var(--unknown); }
.badge.k-pass { background:var(--pass-bg); } .badge.k-warn { background:var(--warn-bg); } .badge.k-block { background:var(--block-bg); }
.badge.k-info { background:var(--info-bg); } .badge.k-unknown { background:var(--unknown-bg); }
.chip { display:inline-flex; align-items:center; gap:5px; font:600 12px/1 var(--sans); padding:5px 9px; border-radius:999px; white-space:nowrap;
  background:var(--surface-2); color:var(--fg); border:1px solid var(--line); }
.chip.k-warn { background:var(--warn-bg); color:var(--warn); border-color:transparent; }
.chip.k-block { background:var(--block-bg); color:var(--block); border-color:transparent; }
.chip.k-pass { background:var(--pass-bg); color:var(--pass); border-color:transparent; }
.chip.k-info { background:var(--info-bg); color:var(--info); border-color:transparent; }
.chip.k-unknown { background:var(--unknown-bg); color:var(--unknown); border-color:transparent; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }

/* --- hero and KPI tiles --- */
.hero { display:grid; grid-template-columns:minmax(0, 1.25fr) minmax(0, 2fr); gap:16px; align-items:stretch; margin-bottom:16px; }
.hero-main { background:linear-gradient(140deg, var(--hero-a) 0%, var(--hero-b) 100%); color:var(--on-hero); border-radius:var(--r-xl);
  padding:22px 24px; box-shadow:var(--shadow-2); display:flex; flex-direction:column; gap:10px; min-width:0; position:relative; overflow:hidden; }
.hero-main::after { content:""; position:absolute; right:-40px; top:-40px; width:180px; height:180px; border-radius:50%;
  border:28px solid rgba(255,255,255,.06); }
.hero-main .eyebrow { font:700 11.5px/1 var(--sans); letter-spacing:.12em; text-transform:uppercase; opacity:.85; }
.hero-main h1 { font-size:30px; line-height:1.12; }
.hero-main .line { font-size:13.5px; opacity:.92; }
.hero-main select { font:600 13px var(--sans); color:var(--on-hero); background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.28);
  border-radius:999px; padding:0 12px; min-height:36px; cursor:pointer; }
.hero-main select option { color:#16201C; }
.hero-main .made { display:inline-flex; gap:6px; align-items:center; font-size:12.5px; background:rgba(255,255,255,.12); border-radius:999px;
  padding:6px 10px; align-self:flex-start; }
.tiles { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:12px; }
.tile { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:14px 16px; box-shadow:var(--shadow-1); min-width:0; }
.tile .l { font:600 12px/1.3 var(--sans); color:var(--muted); letter-spacing:.02em; display:flex; align-items:center; gap:6px; }
.tile .v { font:600 26px/1.15 var(--serif); margin-top:6px; overflow-wrap:anywhere; }
.tile .v.small-v { font-size:17px; font-family:var(--sans); }
.tile .s { font-size:12px; color:var(--muted); margin-top:2px; }
.tile.st-pass .v { color:var(--pass); } .tile.st-warn .v { color:var(--warn); } .tile.st-block .v { color:var(--block); }
.rank-note { font-size:13px; color:var(--muted); margin:-4px 0 0; }

/* --- cards --- */
.grid-cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:16px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px; box-shadow:var(--shadow-2); min-width:0;
  transition:transform var(--t) var(--ease), box-shadow var(--t) var(--ease); }
.card.lift:hover { transform:translateY(-2px); }
.card .top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
.card .sym { font:600 22px/1.1 var(--serif); }
.card .co { font-size:12.5px; color:var(--muted); margin-top:3px; overflow-wrap:anywhere; }
.card .rank { font:700 11px/1 var(--sans); color:var(--accent); letter-spacing:.1em; text-transform:uppercase; margin-bottom:6px; display:block; }
.kv { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px 16px; margin-top:14px; }
.kv div { min-width:0; } .kv dt { font-size:12px; color:var(--muted); } .kv dd { margin:2px 0 0; font-weight:600; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
.why-line { font-size:13px; color:var(--muted); margin-top:12px; padding-top:12px; border-top:1px dashed var(--line-strong); }
.card-actions { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap; }

/* price ladder: stop - entry - target */
.ladder { margin:18px 4px 4px; }
.ladder .track { position:relative; height:10px; border-radius:999px; background:var(--reward-zone); }
.ladder .risk { position:absolute; left:0; top:0; bottom:0; border-radius:999px 0 0 999px; background:var(--risk-zone); }
.ladder .mk { position:absolute; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; background:var(--surface); border:3px solid var(--fg); }
.ladder .mk.stop { border-color:var(--block); border-radius:3px; transform:rotate(45deg); }
.ladder .mk.entry { border-color:var(--info); }
.ladder .mk.target { border-color:var(--pass); }
.ladder .labels { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:8px; font-size:12px; color:var(--muted); }
.ladder .labels span { line-height:1.35; font-variant-numeric:tabular-nums; min-width:0; }
.ladder .labels b { display:block; font-weight:600; color:var(--fg); font-size:13px; }
.ladder .labels .entry { text-align:center; } .ladder .labels .target { text-align:right; }
.ladder .ttl { font-size:11px; color:var(--muted); font-weight:700; letter-spacing:.08em; text-transform:uppercase; display:flex; justify-content:space-between; margin-bottom:6px; }

.spark { margin-top:14px; display:flex; gap:12px; align-items:center; }
.spark svg { flex:1; min-width:0; height:48px; }
.spark .line { fill:none; stroke:var(--primary); stroke-width:1.8; stroke-linejoin:round; }
.spark .chg { font:600 13px var(--sans); white-space:nowrap; text-align:right; }
.spark .chg small { display:block; font-weight:500; color:var(--muted); font-size:11px; }

/* --- buttons --- */
button { font-family:inherit; }
button.link, button.copy, button.close { font:600 13px/1 var(--sans); border-radius:999px; min-height:44px; padding:0 16px; cursor:pointer;
  display:inline-flex; align-items:center; gap:7px; white-space:nowrap; transition:background var(--t) var(--ease), color var(--t) var(--ease), border-color var(--t) var(--ease); }
button.link { color:var(--primary); background:var(--primary-soft); border:1px solid transparent; }
button.link:hover { border-color:var(--primary); }
button.link.slim { min-height:36px; padding:0 12px; }
button.copy { color:var(--on-primary); background:var(--primary); border:1px solid var(--primary); }
button.copy:hover { background:var(--primary-strong); }
button.copy.done { background:var(--pass); border-color:var(--pass); color:var(--on-primary); }
button.close { color:var(--fg); background:var(--surface-2); border:1px solid var(--line); min-width:44px; padding:0 14px; }
button.close:hover { background:var(--surface-3); }

/* --- controls --- */
.controls { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:flex-end; margin:0 0 14px; }
.controls label { display:flex; flex-direction:column; gap:4px; font-size:12px; font-weight:600; color:var(--muted); }
.controls select, .controls input { font:500 14px var(--sans); color:var(--fg); background:var(--surface); border:1px solid var(--line-strong);
  border-radius:var(--r-sm); padding:0 12px; min-height:44px; min-width:150px; }
.controls input[type=search] { min-width:260px; }
.seg { display:inline-flex; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px; flex-wrap:wrap; }
.seg button { font:600 13px var(--sans); color:var(--muted); background:transparent; border:0; border-radius:999px; min-height:38px; padding:0 14px; cursor:pointer;
  transition:background var(--t) var(--ease), color var(--t) var(--ease); }
.seg button[aria-pressed=true] { background:var(--surface); color:var(--fg); box-shadow:var(--shadow-1); }
.count-line { font-size:13px; color:var(--muted); margin:0 0 10px; }

/* --- tables (cards below 900px) --- */
.tcard { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-1); overflow:clip; }
table { width:100%; border-collapse:separate; border-spacing:0; table-layout:fixed; font-size:14px; }
th, td { padding:10px 12px; text-align:left; vertical-align:middle; border-bottom:1px solid var(--line); overflow-wrap:break-word; }
thead th { overflow-wrap:normal; word-break:normal; hyphens:none; position:sticky; top:64px; z-index:2; background:var(--surface-2); font:700 11.5px/1.25 var(--sans); color:var(--muted); letter-spacing:.06em; text-transform:uppercase; }
tbody tr:last-child > td { border-bottom:0; }
tbody tr { transition:background var(--t) var(--ease); }
tbody tr:hover > td { background:color-mix(in srgb, var(--primary) 4%, var(--surface)); }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
td .sub { display:block; font-size:12px; color:var(--muted); margin-top:2px; }
td .trunc { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; color:var(--muted); margin-top:4px; }
th button.sort { font:inherit; color:inherit; letter-spacing:inherit; text-transform:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:inherit; }
th button.sort::after { content:" \2195"; opacity:.6; }
th[aria-sort=ascending] button.sort::after { content:" \2191"; opacity:1; }
th[aria-sort=descending] button.sort::after { content:" \2193"; opacity:1; }
tr.hl > td:first-child { box-shadow:inset 4px 0 0 var(--warn); }
td.empty { text-align:center; color:var(--muted); padding:28px; }
.flag { display:inline-flex; align-items:center; gap:4px; font:600 12px/1.2 var(--sans); white-space:nowrap; margin:4px 8px 0 0; }

/* --- gauges (halal ratios) --- */
.gauge { min-width:0; }
.gauge .bar { position:relative; height:8px; border-radius:999px; background:var(--surface-3); margin:5px 0 4px; }
.gauge .fill { position:absolute; left:0; top:0; bottom:0; border-radius:999px; background:var(--pass); }
.gauge.s-near .fill { background:var(--warn); } .gauge.s-over .fill { background:var(--block); }
.gauge .lim { position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--fg); border-radius:2px; }
.gauge .nr { position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--warn); opacity:.7; }
.gauge .t { display:flex; justify-content:space-between; gap:6px; font-size:12px; font-variant-numeric:tabular-nums; }
.gauge .t .st { display:inline-flex; gap:3px; align-items:center; font-weight:600; white-space:nowrap; }
.gauge .lbl { font-size:12px; color:var(--muted); }
.gauge.big .bar { height:12px; } .gauge.big .t { font-size:13.5px; }

/* --- donut / ring --- */
.donut-wrap { display:flex; gap:24px; align-items:center; flex-wrap:wrap; }
.donut { width:148px; height:148px; flex:none; }
.donut .seg-c { fill:none; stroke-width:16; }
.donut .bg { fill:none; stroke:var(--surface-3); stroke-width:16; }
.donut .c-compliant { stroke:var(--pass); } .donut .c-review { stroke:var(--warn); } .donut .c-excluded { stroke:var(--block); } .donut .c-unknown { stroke:var(--unknown); }
.donut text { fill:var(--fg); font-family:var(--serif); }
.legend { display:grid; gap:8px; min-width:0; }
.legend .row { display:grid; grid-template-columns:auto 40px minmax(0, 1fr); align-items:center; gap:10px; font-size:14px; }
.legend.vchips .row { grid-template-columns:104px 32px minmax(0, 1fr); }
.legend .row .badge, .legend .row .chip { justify-self:start; }
.legend .sw { width:12px; height:12px; border-radius:4px; flex:none; }
.legend .n { font-weight:700; font-variant-numeric:tabular-nums; min-width:34px; text-align:right; }
.sw.c-compliant { background:var(--pass); } .sw.c-review { background:var(--warn); } .sw.c-excluded { background:var(--block); } .sw.c-unknown { background:var(--unknown); }
.ring svg { width:96px; height:96px; }
.ring .bg { fill:none; stroke:var(--surface-3); stroke-width:9; } .ring .fg { fill:none; stroke:var(--primary); stroke-width:9; stroke-linecap:round; }
.ring text { fill:var(--fg); font:600 18px var(--serif); }

/* --- bento --- */
.bento { display:grid; grid-template-columns:repeat(12, minmax(0, 1fr)); gap:16px; }
.span-3 { grid-column:span 3; } .span-4 { grid-column:span 4; } .span-5 { grid-column:span 5; } .span-6 { grid-column:span 6; }
.span-7 { grid-column:span 7; } .span-8 { grid-column:span 8; } .span-12 { grid-column:span 12; }
